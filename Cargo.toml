[workspace]
members = [
    "datafusion/distributed",
    "datafusion/distributed-benchmarks",
    "datafusion/distributed-cli",
    "datafusion/distributed-console",
    "datafusion/distributed-iceberg",
    "datafusion/distributed-iceberg-benchmarks",
    "datafusion/distributed-iceberg-test-tools",
    "datafusion/distributed-remote-worker",
]
# Plain `cargo build`/`cargo test` from the repository root target the core library.
default-members = ["datafusion/distributed"]
resolver = "3"

[workspace.dependencies]
datafusion = { version = "55", default-features = false }
datafusion-proto = { version = "55", default-features = false }

# datafusion-iceberg depends on apache/iceberg-rust; use the same fork so FileScanTask is one type.
[patch."https://github.com/apache/iceberg-rust"]
iceberg = { git = "https://github.com/DataDog/iceberg-rust", branch = "alex.bianchi/datafusion-55-pr-3081-column-stats" }
iceberg-storage-opendal = { git = "https://github.com/DataDog/iceberg-rust", branch = "alex.bianchi/datafusion-55-pr-3081-column-stats" }

[workspace.lints.clippy]
disallowed_types = "deny"
disallowed-methods = "deny"
